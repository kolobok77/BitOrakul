<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ORAKUL V5 // REVERSED</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #fff200;
            --bg-dark: #050505;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-transform: uppercase;
            font-size: 14px;
        }

        /* Эффект сканирования */
        body::after {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 100;
        }

        header {
            display: flex; justify-content: space-between;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 5px; margin-bottom: 10px;
            font-size: 10px;
        }

        .main-display {
            display: flex; flex-direction: column; gap: 10px;
        }

        .node {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            padding: 12px; position: relative;
        }

        .node-label { font-size: 9px; color: var(--neon-magenta); margin-bottom: 5px; }
        
        .big-val { 
            font-size: 2rem; font-weight: bold; 
            transition: all 0.3s ease;
        }

        .status-fiat { color: var(--neon-yellow) !important; text-shadow: 0 0 10px var(--neon-yellow); }
        .status-long { color: var(--neon-green) !important; text-shadow: 0 0 10px var(--neon-green); }
        .status-short { color: var(--neon-red) !important; text-shadow: 0 0 10px var(--neon-red); }

        .controls {
            display: grid; grid-template-columns: 1fr 100px; gap: 10px;
            margin-top: 5px;
        }

        #stop-btn {
            background: none; border: 1px solid var(--neon-red);
            color: var(--neon-red); font-family: inherit;
            font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }

        #stop-btn.active { background: var(--neon-red); color: black; box-shadow: 0 0 15px var(--neon-red); }

        input[type=range] { width: 100%; accent-color: var(--neon-magenta); }

        #terminal {
            flex-grow: 1; margin-top: 10px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--neon-magenta);
            padding: 8px; overflow-y: auto;
            font-size: 10px; line-height: 1.2;
        }

        .log { margin-bottom: 3px; border-left: 2px solid var(--neon-cyan); padding-left: 5px; }
        .buy { color: var(--neon-green); border-color: var(--neon-green); }
        .short { color: var(--neon-red); border-color: var(--neon-red); }

        .chips { display: flex; gap: 5px; margin-top: 5px; }
        .chip { font-size: 8px; border: 1px solid #333; padding: 1px 4px; }
        .chip.active { border-color: var(--neon-green); color: var(--neon-green); }
    </style>
</head>
<body>

<header>
    <div>BIT_ORAKUL_V5 // REVERSED_CORE</div>
    <div id="sys-clock">00:00:00</div>
</header>

<div class="main-display">
    <div class="node">
        <div class="node-label">MARKET_PULSE (BTC)</div>
        <div id="price" class="big-val" style="color: var(--neon-cyan)">00000.00</div>
        <div class="chips">
            <div id="ind-ema" class="chip">EMA_CROSS</div>
            <div id="ind-rsi" class="chip">RSI_VOL</div>
            <div id="ind-bb" class="chip">BB_LIMIT</div>
        </div>
    </div>

    <div class="node">
        <div class="node-label">LEDGER_STATE (USDT)</div>
        <div id="balance" class="big-val status-fiat">$10,000.00</div>
        <div style="font-size: 10px; margin-top: 5px; display: flex; justify-content: space-between;">
            <span>POS: <span id="pos-type">FLAT</span></span>
            <span id="pnl-val">0.00%</span>
        </div>
    </div>

    <div class="node">
        <div class="node-label">NEURAL_DYNAMICS</div>
        <div class="controls">
            <div>
                <div style="font-size: 8px; margin-bottom: 2px;">VELOCITY: <span id="spd-lbl">SWING</span></div>
                <input type="range" id="spd-sld" min="1" max="5" value="3">
            </div>
            <button id="stop-btn">STOP_AI</button>
        </div>
    </div>
</div>

<div id="terminal"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4",
        authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com",
        projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app",
        messagingSenderId: "664775878094",
        appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        balance: 10000,
        position: null,
        prices: [],
        speed: 3,
        running: true
    };

    const Profiles = {
        1: { n: "SCALP", i: 2000, ef: 3, es: 7, r: 7 },
        2: { n: "INTRADAY", i: 10000, ef: 8, es: 21, r: 14 },
        3: { n: "SWING", i: 60000, ef: 12, es: 26, r: 14 },
        4: { n: "TREND", i: 300000, ef: 20, es: 50, r: 21 },
        5: { n: "HODL", i: 3600000, ef: 50, es: 200, r: 21 }
    };

    const MathCore = {
        ema: (d, n) => { let k = 2/(n+1); let e = d[0]; for(let i=1;i<d.length;i++) e = d[i]*k+e*(1-k); return e; },
        rsi: (d, n) => {
            if(d.length <= n) return 50;
            let g=0, l=0; for(let i=d.length-n; i<d.length; i++) { let diff = d[i]-d[i-1]; if(diff>=0) g+=diff; else l-=diff; }
            return 100-(100/(1+(g/n)/((l/n)||1)));
        }
    };

    function log(msg, type='') {
        const t = document.getElementById('terminal');
        const d = document.createElement('div');
        d.className = `log ${type}`;
        d.innerHTML = `> ${msg}`;
        t.prepend(d);
        if(t.children.length > 30) t.lastChild.remove();
    }

    async function sync() {
        db.ref('orakel_v5_final').set({ bal: state.balance, pos: state.position, run: state.running, spd: state.speed });
    }

    function trade(side, price) {
        if (!state.running && side !== 'CLOSE') return;

        if (side === 'LONG' || side === 'SHORT') {
            state.position = { price, amount: state.balance / price, type: side };
            state.balance = 0;
            log(`EXECUTE_${side}: ${price.toFixed(2)}`, side.toLowerCase());
        } else if (side === 'CLOSE') {
            if (!state.position) return;
            const p = state.position;
            state.balance = (p.type === 'LONG') ? p.amount * price : (p.amount * p.price) + (p.price - price) * p.amount;
            log(`CLOSED_${p.type}: BAL $${state.balance.toFixed(2)}`, 'sys');
            state.position = null;
        }
        sync();
        updateUI();
    }

    function updateUI() {
        const b = document.getElementById('balance');
        b.className = 'big-val';
        if (!state.position) b.classList.add('status-fiat');
        else b.classList.add(state.position.type === 'LONG' ? 'status-long' : 'status-short');
        document.getElementById('pos-type').innerText = state.position ? state.position.type : 'FLAT';
    }

    function brain() {
        if (!state.running) return;
        const p = parseFloat(document.getElementById('price').innerText);
        if (!p) return;
        state.prices.push(p); if(state.prices.length > 300) state.prices.shift();
        
        const conf = Profiles[state.speed];
        if(state.prices.length < conf.es) return;

        const ef = MathCore.ema(state.prices, conf.ef);
        const es = MathCore.ema(state.prices, conf.es);
        const r = MathCore.rsi(state.prices, conf.r);
        
        document.getElementById('ind-ema').className = `chip ${ef > es ? 'active' : ''}`;
        document.getElementById('ind-rsi').className = `chip ${r > 50 ? 'active' : ''}`;

        // --- REVERSE SAR LOGIC (Always-in-Market) ---
        const threshold = p * 0.0001; // 0.01% hysteresis

        if (!state.position) {
            if (ef > es + threshold) trade('LONG', p);
            else if (ef < es - threshold) trade('SHORT', p);
        } else {
            // Flip triggers
            if (state.position.type === 'LONG' && ef < es - threshold) {
                trade('CLOSE', p); trade('SHORT', p);
            } else if (state.position.type === 'SHORT' && ef > es + threshold) {
                trade('CLOSE', p); trade('LONG', p);
            }
        }
    }

    // Stop Button
    document.getElementById('stop-btn').onclick = function() {
        state.running = !state.running;
        this.classList.toggle('active');
        this.innerText = state.running ? 'STOP_AI' : 'START_AI';
        if (!state.running && state.position) {
            const p = parseFloat(document.getElementById('price').innerText);
            trade('CLOSE', p);
        }
        log(state.running ? "AI_CORE: RE-ACTIVATED" : "AI_CORE: EMERGENCY_PAUSE", "sys");
        sync();
    };

    // Slider
    const sld = document.getElementById('spd-sld');
    sld.oninput = function() {
        state.speed = this.value;
        const c = Profiles[this.value];
        document.getElementById('spd-lbl').innerText = c.n;
        clearInterval(window.bT); window.bT = setInterval(brain, c.i);
        log(`CORE_UPDATE: MODE_${c.n}`, "sys");
        sync();
    };

    // WS Binance
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');
    ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        const p = parseFloat(d.c);
        document.getElementById('price').innerText = p.toFixed(2);
        if (state.position) {
            const pos = state.position;
            const pnl = (pos.type === 'LONG') ? ((p/pos.price-1)*100) : ((pos.price/p-1)*100);
            document.getElementById('pnl-val').innerText = pnl.toFixed(2) + "%";
            document.getElementById('pnl-val').style.color = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            const curBal = (pos.type === 'LONG') ? pos.amount * p : (pos.amount * pos.price) + (pos.price - p) * pos.amount;
            document.getElementById('balance').innerText = `$${curBal.toFixed(2)}`;
        } else {
            document.getElementById('balance').innerText = `$${state.balance.toFixed(2)}`;
            document.getElementById('pnl-val').innerText = "0.00%";
        }
    };

    window.onload = () => {
        if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
        db.ref('orakel_v5_final').once('value').then(s => {
            const d = s.val();
            if (d) { 
                state.balance = d.bal || 10000; 
                state.position = d.pos || null;
                state.running = (d.run !== undefined) ? d.run : true;
                state.speed = d.spd || 3;
                sld.value = state.speed;
                if(!state.running) {
                    const b = document.getElementById('stop-btn');
                    b.classList.add('active'); b.innerText = 'START_AI';
                }
            }
            sld.oninput();
            updateUI();
            log("ORAKUL_V5_STABLE: LINKED", "sys");
        });
        setInterval(() => document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString(), 1000);
    };
</script>
</body>
</html>
