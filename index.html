<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIT-ORAKUL V7.2 // TOTAL_UNITY</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #fff200;
            --bg-dark: #050505;
            --panel-bg: rgba(0, 243, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-transform: uppercase;
        }

        /* Эффект старого монитора */
        body::before {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px; pointer-events: none; z-index: 1000;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 5px; margin-bottom: 10px; font-size: 10px;
        }

        .node-stack { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }

        .node {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            padding: 12px; position: relative;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        .node-label { 
            font-size: 9px; color: var(--neon-magenta); 
            margin-bottom: 5px; display: flex; justify-content: space-between; 
        }
        
        .big-val { font-size: 2.2rem; font-weight: bold; transition: all 0.3s ease; }
        
        /* Цвета состояния аккаунта */
        .status-fiat { color: var(--neon-yellow) !important; text-shadow: 0 0 15px var(--neon-yellow); }
        .status-long { color: var(--neon-green) !important; text-shadow: 0 0 15px var(--neon-green); }
        .status-short { color: var(--neon-red) !important; text-shadow: 0 0 15px var(--neon-red); }

        .indicator-row { display: flex; gap: 5px; margin-top: 5px; }
        
        /* Стили чипов-индикаторов */
        .chip { 
            font-size: 8px; border: 1px solid #333; padding: 2px 5px; 
            color: #444; transition: 0.3s; 
        }
        .chip.buy { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .chip.sell { border-color: var(--neon-red); color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }
        .chip.neutral { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

        .btn {
            background: none; border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); font-family: inherit;
            padding: 10px; cursor: pointer; font-weight: bold; font-size: 11px;
        }

        #stop-btn { border-color: var(--neon-red); color: var(--neon-red); }
        #stop-btn.active { background: var(--neon-red); color: black; box-shadow: 0 0 20px var(--neon-red); }

        .master-box {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 10px; padding: 8px; border: 1px dashed var(--neon-magenta);
        }

        input[type=range] { width: 100%; accent-color: var(--neon-magenta); margin: 8px 0; }

        #terminal {
            flex-grow: 1; margin-top: 10px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--neon-magenta);
            padding: 10px; overflow-y: auto;
            font-size: 10px; line-height: 1.3;
        }

        .log { margin-bottom: 3px; border-left: 2px solid var(--neon-cyan); padding-left: 8px; }
        .buy-log { color: var(--neon-green); border-color: var(--neon-green); }
        .sell-log { color: var(--neon-red); border-color: var(--neon-red); }
        .sys-log { color: #888; }

        #online-count { color: var(--neon-green); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div>NET: <span id="online-count">1</span> NODES // <span id="net-status">SYNCING</span></div>
    <div id="sys-clock">00:00:00</div>
</header>

<div class="node-stack">
    <div class="node">
        <div class="node-label">
            <span>MARKET_CORE: BTC/USDT</span>
            <span id="last-update">--:--:--</span>
        </div>
        <div id="price" class="big-val">00000.00</div>
        <div class="indicator-row">
            <div id="ind-ema" class="chip">EMA_X</div>
            <div id="ind-rsi" class="chip">RSI_VOL</div>
            <div id="ind-bb" class="chip">BB_REVERSE</div>
        </div>
    </div>

    <div class="node">
        <div class="node-label">LEDGER_STATE: FIREBASE_CLOUD</div>
        <div id="balance" class="big-val status-fiat">$10,000.00</div>
        <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:11px;">
            <span>POS: <span id="pos-type">FLAT</span></span>
            <span id="pnl-val">0.00%</span>
        </div>
    </div>

    <div class="node">
        <div class="node-label">NEURAL_DYNAMICS</div>
        <div style="font-size: 9px; color: var(--neon-magenta)">VELOCITY: <span id="spd-lbl">SWING</span></div>
        <input type="range" id="spd-sld" min="1" max="5" value="3">
        
        <div class="controls">
            <div class="master-box">
                <span>MASTER_BRAIN</span>
                <input type="checkbox" id="master-toggle" checked>
            </div>
            <button id="stop-btn" class="btn">STOP_AI</button>
        </div>
    </div>
</div>

<div id="terminal"></div>

<script>
    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4",
        authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com",
        projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app",
        messagingSenderId: "664775878094",
        appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 2. GLOBAL STATE ---
    let state = {
        balance: 10000,
        position: null,
        prices: [],
        speed: 3,
        running: true,
        isMaster: true,
        lastPriceTime: Date.now()
    };

    const Profiles = {
        1: { n: "SCALP", i: 2000, ef: 3, es: 7, r: 7, b: 10 },
        2: { n: "INTRADAY", i: 10000, ef: 8, es: 21, r: 14, b: 20 },
        3: { n: "SWING", i: 60000, ef: 12, es: 26, r: 14, b: 20 },
        4: { n: "TREND", i: 300000, ef: 20, es: 50, r: 21, b: 30 },
        5: { n: "HODL", i: 3600000, ef: 50, es: 200, r: 21, b: 50 }
    };

    // --- 3. AUDIO ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, duration = 0.1) {
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // --- 4. MATH CORE ---
    const MathCore = {
        ema: (d, n) => { 
            let k = 2 / (n + 1); let e = d[0]; 
            for (let i = 1; i < d.length; i++) e = d[i] * k + e * (1 - k); 
            return e; 
        },
        rsi: (d, n) => {
            if (d.length <= n) return 50;
            let g = 0, l = 0;
            for (let i = d.length - n; i < d.length; i++) {
                let diff = d[i] - d[i - 1];
                if (diff >= 0) g += diff; else l -= diff;
            }
            return 100 - (100 / (1 + (g / n) / ((l / n) || 1)));
        },
        bb: (d, n) => {
            if (d.length < n) return { u: 0, m: 0, l: 0 };
            let s = d.slice(-n);
            let m = s.reduce((a, b) => a + b) / n;
            let sd = Math.sqrt(s.map(x => Math.pow(x - m, 2)).reduce((a, b) => a + b) / n);
            return { u: m + (sd * 2), m: m, l: m - (sd * 2) };
        }
    };

    // --- 5. UI & LOGGING ---
    function log(msg, type = '') {
        const t = document.getElementById('terminal');
        const d = document.createElement('div');
        d.className = `log ${type}`;
        d.innerHTML = `[${new Date().toLocaleTimeString([], { hour12: false })}] > ${msg}`;
        t.prepend(d);
        if (t.children.length > 30) t.lastChild.remove();
    }

    function updateBalanceUI(price) {
        const balEl = document.getElementById('balance');
        const pnlEl = document.getElementById('pnl-val');
        const posEl = document.getElementById('pos-type');

        if (state.position) {
            const pos = state.position;
            const pnl = (pos.type === 'LONG') ? ((price / pos.price - 1) * 100) : ((pos.price / price - 1) * 100);
            const currentBalance = (pos.type === 'LONG') ? (pos.amount * price) : (pos.amount * pos.price + (pos.price - price) * pos.amount);
            
            balEl.innerText = `$${currentBalance.toFixed(2)}`;
            balEl.className = 'big-val ' + (pos.type === 'LONG' ? 'status-long' : 'status-short');
            pnlEl.innerText = pnl.toFixed(2) + "%";
            pnlEl.style.color = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            posEl.innerText = pos.type;
        } else {
            balEl.innerText = `$${state.balance.toFixed(2)}`;
            balEl.className = 'big-val status-fiat';
            pnlEl.innerText = "0.00%";
            pnlEl.style.color = 'var(--neon-cyan)';
            posEl.innerText = "FLAT";
        }
    }

    // --- 6. TRADING LOGIC (REVERSE SAR) ---
    function trade(side, price) {
        if (!state.isMaster) return;
        
        if (side === 'LONG' || side === 'SHORT') {
            state.position = { price: price, amount: (state.balance || 10000) / price, type: side };
            state.balance = 0;
            log(`EXECUTE_${side}: BTC @ ${price.toFixed(2)}`, side === 'LONG' ? 'buy-log' : 'sell-log');
            beep(880, 0.2);
        } else if (side === 'CLOSE') {
            const p = state.position;
            if (!p) return;
            state.balance = (p.type === 'LONG') ? p.amount * price : (p.amount * p.price + (p.price - price) * p.amount);
            log(`CLOSED_${p.type}: FINAL_BAL $${state.balance.toFixed(2)}`, 'sys-log');
            state.position = null;
            beep(440, 0.2);
        }
        
        // Синхронизация с облаком
        db.ref('orakel_v7_final').set({
            bal: state.balance,
            pos: state.position,
            run: state.running,
            spd: state.speed,
            updatedAt: Date.now()
        });
    }

    function brain() {
        const p = parseFloat(document.getElementById('price').innerText);
        if (!p || isNaN(p)) return;

        state.prices.push(p);
        if (state.prices.length > 300) state.prices.shift();

        const conf = Profiles[state.speed];
        if (state.prices.length < conf.es) return;

        const ef = MathCore.ema(state.prices, conf.ef);
        const es = MathCore.ema(state.prices, conf.es);
        const rsi = MathCore.rsi(state.prices, conf.r);
        const bb = MathCore.bb(state.prices, conf.b);

        // Порог проскальзывания (Hysteresis 0.02%)
        const threshold = p * 0.0002;

        // Обновление цветов индикаторов (Для всех сессий)
        const indEma = document.getElementById('ind-ema');
        const indRsi = document.getElementById('ind-rsi');
        const indBb = document.getElementById('ind-bb');

        indEma.className = 'chip ' + (ef > es + threshold ? 'buy' : (ef < es - threshold ? 'sell' : 'neutral'));
        indRsi.className = 'chip ' + (rsi > 55 ? 'buy' : (rsi < 45 ? 'sell' : 'neutral'));
        indBb.className = 'chip ' + (p < bb.l ? 'buy' : (p > bb.u ? 'sell' : 'neutral'));

        // Только мастер принимает торговое решение
        if (!state.running || !state.isMaster) return;

        if (!state.position) {
            // Вход в первую позицию
            if (ef > es + threshold && rsi > 52) trade('LONG', p);
            else if (ef < es - threshold && rsi < 48) trade('SHORT', p);
        } else {
            // Логика ПЕРЕВОРОТА
            if (state.position.type === 'LONG' && ef < es - threshold) {
                trade('CLOSE', p); trade('SHORT', p);
            } else if (state.position.type === 'SHORT' && ef > es + threshold) {
                trade('CLOSE', p); trade('LONG', p);
            }
        }
    }

    // --- 7. NETWORK & SYNC ---
    function initNetwork() {
        const ws = new WebSocket('wss://stream.binance.com:443/ws/btcusdt@ticker');
        const netStatus = document.getElementById('net-status');

        ws.onopen = () => {
            netStatus.innerText = "ONLINE";
            netStatus.style.color = "var(--neon-green)";
            log("BINANCE_STREAM: LINK_STABLE", "sys-log");
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            const p = parseFloat(data.c);
            state.lastPriceTime = Date.now();
            
            document.getElementById('price').innerText = p.toFixed(2);
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString([], {hour12:false});
            
            updateBalanceUI(p);
        };

        ws.onclose = () => {
            netStatus.innerText = "LOST";
            netStatus.style.color = "var(--neon-red)";
            log("CRITICAL: CONNECTION_LOST. RECONNECTING...", "sell-log");
            setTimeout(initNetwork, 3000);
        };
    }

    // Watchdog: бип, если цена не обновлялась 10 сек
    setInterval(() => {
        if (state.running && (Date.now() - state.lastPriceTime > 10000)) {
            beep(220, 0.5);
            log("WATCHDOG: DATA_FLOW_STALLED!", "sell-log");
        }
    }, 10000);

    // Слушатель Firebase
    db.ref('orakel_v7_final').on('value', (snapshot) => {
        const d = snapshot.val();
        if (!d) return;

        state.balance = d.bal;
        state.position = d.pos;
        state.running = d.run;
        
        if (state.speed !== d.spd) {
            state.speed = d.spd;
            document.getElementById('spd-sld').value = d.spd;
            document.getElementById('spd-lbl').innerText = Profiles[d.spd].n;
            if (state.isMaster) {
                clearInterval(window.brainTimer);
                window.brainTimer = setInterval(brain, Profiles[d.spd].i);
            }
        }

        const stopBtn = document.getElementById('stop-btn');
        stopBtn.className = state.running ? 'btn' : 'btn active';
        stopBtn.innerText = state.running ? 'STOP_AI' : 'START_AI';
        
        updateBalanceUI(parseFloat(document.getElementById('price').innerText));
    });

    // Presence (Счетчик узлов)
    const presenceRef = db.ref('presence_v7').push();
    presenceRef.onDisconnect().remove();
    presenceRef.set(true);

    let isInitialCheck = true;
    db.ref('presence_v7').on('value', (snap) => {
        const count = snap.numChildren();
        document.getElementById('online-count').innerText = count;
        
        // AUTO-OBSERVER: если мы вторые в сети, отключаем Master при старте
        if (isInitialCheck && count > 1) {
            document.getElementById('master-toggle').checked = false;
            state.isMaster = false;
            log("UNITY: AUTO_OBSERVER_MODE_ACTIVE", "sys-log");
        }
        isInitialCheck = false;
    });

    // --- 8. UI CONTROLS ---
    document.getElementById('stop-btn').onclick = function() {
        const currentPrice = parseFloat(document.getElementById('price').innerText);
        if (state.running && state.position) {
            trade('CLOSE', currentPrice);
        }
        db.ref('orakel_v7_final').update({ run: !state.running });
        beep(600, 0.1);
    };

    document.getElementById('master-toggle').onchange = function() {
        state.isMaster = this.checked;
        log(state.isMaster ? "CORE: MASTER_NODE_ONLINE" : "CORE: OBSERVER_MODE", "sys-log");
        if (state.isMaster) {
            window.brainTimer = setInterval(brain, Profiles[state.speed].i);
        } else {
            clearInterval(window.brainTimer);
        }
    };

    document.getElementById('spd-sld').oninput = function() {
        db.ref('orakel_v7_final').update({ spd: parseInt(this.value) });
    };

    // --- 9. INIT ---
    window.onload = () => {
        // Удержание экрана (Wake Lock)
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
        
        initNetwork();
        
        // Запуск часов
        setInterval(() => {
            document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString([], { hour12: false });
        }, 1000);

        log("SYSTEM_READY: ORAKUL_V7.2_STABLE", "sys-log");
    };

</script>
</body>
</html>
