<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT_ORAKUL // TERMINAL V2</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-transform: uppercase;
        }

        body::after {
            content: " ";
            position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        header {
            display: flex; justify-content: space-between;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 10px; margin-bottom: 20px;
        }

        .grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        .node {
            background: rgba(0, 243, 255, 0.03);
            border: 1px solid var(--neon-cyan);
            padding: 15px; position: relative;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        .node-label { font-size: 10px; color: var(--neon-magenta); margin-bottom: 10px; }
        .big-val { font-size: 2.8rem; font-weight: bold; color: var(--neon-green); text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }

        #log-container {
            flex-grow: 1; margin-top: 20px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--neon-magenta);
            padding: 10px; overflow-y: auto;
            box-shadow: inset 0 0 15px rgba(255, 0, 255, 0.1);
            scrollbar-width: thin;
            scrollbar-color: var(--neon-magenta) black;
        }

        .log-entry { font-size: 12px; margin-bottom: 5px; border-left: 2px solid var(--neon-cyan); padding-left: 8px; animation: blink 0.1s ease-in; }
        @keyframes blink { from { opacity: 0; } to { opacity: 1; } }

        .buy { border-color: var(--neon-green); color: var(--neon-green); }
        .sell { border-color: var(--neon-red); color: var(--neon-red); }

        .indicator-group { display: flex; gap: 10px; margin-top: 10px; }
        .chip { font-size: 10px; border: 1px solid #333; padding: 2px 8px; transition: 0.3s; }
        .chip.active { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
        
        #pnl-val { font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div>ORACLE_SYSTEM: BIT_ORAKUL // NODE: LIVE</div>
    <div id="clock">00:00:00</div>
</header>

<div class="grid">
    <div class="node">
        <div class="node-label">BINANCE_WS: BTC/USDT</div>
        <div id="price" class="big-val">00000.00</div>
        <div class="indicator-group">
            <div id="ind-ema" class="chip">EMA_TREND</div>
            <div id="ind-rsi" class="chip">RSI_MOMENTUM</div>
            <div id="ind-bb" class="chip">BB_BREAKOUT</div>
        </div>
        <div style="font-size: 11px; margin-top: 10px; color: #888;">
            RSI: <span id="rsi-num" style="color: var(--neon-cyan);">--</span> | 
            EMA_DIST: <span id="ema-dist" style="color: var(--neon-cyan);">--</span>
        </div>
    </div>

    <div class="node">
        <div class="node-label">FIREBASE_LEDGER: ACCOUNT_01</div>
        <div id="balance" class="big-val">$10,000.00</div>
        <div style="font-size: 11px; margin-top: 10px;">
            POS: <span id="pos-type" style="color: var(--neon-magenta);">FLAT</span> | 
            SESSION_PNL: <span id="pnl-val">$0.00</span>
        </div>
    </div>
</div>

<div id="log-container">
    <div class="log-entry">INITIALIZING NEURAL BRIDGE...</div>
</div>

<script>
    // --- ДАННЫЕ ИЗ ТВОЕГО СКРИНШОТА ---
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4",
        authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com",
        projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app",
        messagingSenderId: "664775878094",
        appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        balance: 10000,
        position: null, // { price, amount }
        prices: []
    };

    const MathCore = {
        ema: (data, n) => {
            let k = 2 / (n + 1);
            let ema = data[0];
            for (let i = 1; i < data.length; i++) ema = data[i] * k + ema * (1 - k);
            return ema;
        },
        rsi: (data, n = 14) => {
            if (data.length <= n) return 50;
            let gains = 0, losses = 0;
            for (let i = data.length - n; i < data.length; i++) {
                let d = data[i] - data[i-1];
                if (d >= 0) gains += d; else losses -= d;
            }
            let rs = (gains/n) / ((losses/n) || 1);
            return 100 - (100 / (1 + rs));
        },
        bb: (data, n = 20) => {
            if (data.length < n) return {u: 0, l: 0, m: 0};
            let slice = data.slice(-n);
            let m = slice.reduce((a,b)=>a+b)/n;
            let sd = Math.sqrt(slice.map(x=>Math.pow(x-m,2)).reduce((a,b)=>a+b)/n);
            return {u: m + (sd*2), l: m - (sd*2), m: m};
        }
    };

    function log(msg, type = '') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        const container = document.getElementById('log-container');
        container.prepend(div);
    }

    async function sync() {
        try {
            await db.ref('orakel_live_state').set({
                balance: state.balance,
                position: state.position,
                timestamp: Date.now()
            });
        } catch(e) { console.error("Firebase Sync Fail", e); }
    }

    function execute(type, price) {
        if (type === 'BUY' && !state.position) {
            state.position = { price, amount: state.balance / price };
            state.balance = 0;
            log(`CRITICAL: BUY ORDER EXECUTED @ ${price.toFixed(2)}`, 'buy');
        } else if (type === 'SELL' && state.position) {
            state.balance = state.position.amount * price;
            log(`CRITICAL: SELL ORDER EXECUTED @ ${price.toFixed(2)}. NEW BAL: $${state.balance.toFixed(2)}`, 'sell');
            state.position = null;
        }
        sync();
    }

    function brain(currentPrice) {
        state.prices.push(currentPrice);
        if (state.prices.length > 100) state.prices.shift();
        if (state.prices.length < 30) return;

        const h = state.prices;
        const emaF = MathCore.ema(h, 12);
        const emaS = MathCore.ema(h, 26);
        const rsi = MathCore.rsi(h, 14);
        const bb = MathCore.bb(h, 20);

        // Индикаторы в UI
        document.getElementById('rsi-num').innerText = rsi.toFixed(1);
        document.getElementById('ema-dist').innerText = (emaF - emaS).toFixed(2);
        document.getElementById('ind-ema').className = `chip ${emaF > emaS ? 'active' : ''}`;
        document.getElementById('ind-rsi').className = `chip ${rsi > 52 && rsi < 68 ? 'active' : ''}`;
        document.getElementById('ind-bb').className = `chip ${currentPrice > bb.u ? 'active' : ''}`;

        // ЛОГИКА ОРАКУЛА (Hybrid)
        if (!state.position) {
            // Вход: Быстрая EMA выше медленной + Цена пробила верхний Боллинджер + RSI подтверждает силу
            if (emaF > emaS && currentPrice > bb.u && rsi > 52) {
                execute('BUY', currentPrice);
            }
        } else {
            // Выход: Смена тренда EMA или RSI перекуплен (>75) или цена упала ниже средней линии Боллинджера
            if (emaF < emaS || rsi > 75 || currentPrice < bb.m) {
                execute('SELL', currentPrice);
            }
        }
    }

    // Часы
    setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);

    // WebSocket Binance
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');
    ws.onmessage = (e) => {
        const p = parseFloat(JSON.parse(e.data).c);
        document.getElementById('price').innerText = p.toFixed(2);
        
        // Расчет текущего баланса и PnL
        let currentTotal = state.balance;
        if (state.position) {
            currentTotal = state.position.amount * p;
            let pnlPerc = ((p / state.position.price - 1) * 100).toFixed(2);
            document.getElementById('pnl-val').innerText = `${pnlPerc}%`;
            document.getElementById('pnl-val').style.color = pnlPerc >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            document.getElementById('pos-type').innerText = "LONG";
        } else {
            document.getElementById('pnl-val').innerText = "$0.00";
            document.getElementById('pos-type').innerText = "FLAT";
        }
        document.getElementById('balance').innerText = `$${currentTotal.toFixed(2)}`;
    };

    // Цикл принятия решений (каждые 5 секунд)
    setInterval(() => {
        const p = parseFloat(document.getElementById('price').innerText);
        if (p > 0) brain(p);
    }, 5000);

    // Загрузка состояния при старте
    db.ref('orakel_live_state').once('value').then(s => {
        const d = s.val();
        if (d) { 
            state.balance = d.balance || 10000; 
            state.position = d.position || null;
            log("SUCCESS: SECURE_CLOUD_LINK ESTABLISHED. STATE LOADED.");
        }
    });
</script>

</body>
</html>
