<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT_ORAKUL // TOTAL_CONTROL_V4</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #fff200;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-transform: uppercase;
        }

        header {
            display: flex; justify-content: space-between;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 10px; margin-bottom: 20px;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .node {
            background: rgba(0, 243, 255, 0.03);
            border: 1px solid var(--neon-cyan);
            padding: 15px; position: relative;
            transition: all 0.5s ease;
        }

        .node-label { font-size: 10px; color: var(--neon-magenta); margin-bottom: 10px; }
        
        .big-val { 
            font-size: 2.5rem; 
            font-weight: bold; 
            transition: color 0.5s ease;
            text-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* Цвета баланса */
        .status-fiat { color: var(--neon-yellow) !important; text-shadow: 0 0 10px var(--neon-yellow); }
        .status-long { color: var(--neon-green) !important; text-shadow: 0 0 10px var(--neon-green); }
        .status-short { color: var(--neon-red) !important; text-shadow: 0 0 10px var(--neon-red); }

        .slider-box { margin-top: 15px; border-top: 1px solid #222; padding-top: 10px; }
        input[type=range] {
            width: 100%; cursor: pointer; accent-color: var(--neon-magenta);
            background: #111;
        }

        #log-container {
            flex-grow: 1; margin-top: 20px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--neon-magenta);
            padding: 10px; overflow-y: auto;
            box-shadow: inset 0 0 15px rgba(255, 0, 255, 0.1);
        }

        .log-entry { font-size: 11px; margin-bottom: 4px; border-left: 2px solid var(--neon-cyan); padding-left: 8px; }
        .buy { color: var(--neon-green); border-color: var(--neon-green); }
        .short { color: var(--neon-red); border-color: var(--neon-red); }
        .sys { color: var(--neon-cyan); }

        .indicator-group { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .chip { font-size: 9px; border: 1px solid #333; padding: 2px 5px; }
        .chip.active { border-color: var(--neon-green); color: var(--neon-green); }
    </style>
</head>
<body>

<header>
    <div>ORACLE_SYSTEM: BIT_ORAKUL // NODE: LIVE</div>
    <div id="clock">00:00:00</div>
</header>

<div class="grid">
    <div class="node">
        <div class="node-label">MARKET_FEED</div>
        <div id="price" class="big-val" style="color: var(--neon-cyan)">00000.00</div>
        <div class="indicator-group">
            <div id="ind-ema" class="chip">EMA</div>
            <div id="ind-rsi" class="chip">RSI</div>
            <div id="ind-bb" class="chip">BB</div>
        </div>
        <div style="font-size: 10px; margin-top: 10px;">
            MODE: <span id="mode-text" style="color:var(--neon-magenta)">MEDIUM</span>
        </div>
    </div>

    <div class="node" id="account-node">
        <div class="node-label">LEDGER_STATE</div>
        <div id="balance" class="big-val status-fiat">$10,000.00</div>
        <div class="slider-box">
            <div style="font-size: 9px; margin-bottom: 5px;">VELOCITY: <span id="speed-label">1-2 / DAY</span></div>
            <input type="range" id="speed-slider" min="1" max="5" value="3">
        </div>
        <div style="font-size: 10px; margin-top: 10px;">
            PNL: <span id="pnl-val">0.00%</span> | POS: <span id="pos-type">FLAT</span>
        </div>
    </div>
</div>

<div id="log-container"></div>

<script>
    // --- FIREBASE CONFIG (FROM YOUR SCREENSHOTS) ---
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4",
        authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com",
        projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app",
        messagingSenderId: "664775878094",
        appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        balance: 10000,
        position: null, // { price, amount, type: 'LONG' | 'SHORT' }
        prices: [],
        speedMode: 3
    };

    const SpeedProfiles = {
        1: { name: "SCALPER", label: "1-2 / MIN", interval: 2000, emaF: 3, emaS: 7, rsiP: 7, bbP: 10 },
        2: { name: "INTRADAY", label: "1-2 / HOUR", interval: 10000, emaF: 8, emaS: 21, rsiP: 14, bbP: 20 },
        3: { name: "SWING", label: "1-2 / DAY", interval: 60000, emaF: 12, emaS: 26, rsiP: 14, bbP: 20 },
        4: { name: "TREND", label: "1-2 / WEEK", interval: 300000, emaF: 20, emaS: 50, rsiP: 21, bbP: 30 },
        5: { name: "HODL", label: "1-2 / MONTH", interval: 3600000, emaF: 50, emaS: 200, rsiP: 21, bbP: 50 }
    };

    const MathCore = {
        ema: (data, n) => {
            let k = 2 / (n + 1); let ema = data[0];
            for (let i = 1; i < data.length; i++) ema = data[i] * k + ema * (1 - k);
            return ema;
        },
        rsi: (data, n) => {
            if (data.length <= n) return 50;
            let g = 0, l = 0;
            for (let i = data.length - n; i < data.length; i++) {
                let d = data[i] - data[i-1];
                if (d >= 0) g += d; else l -= d;
            }
            return 100 - (100 / (1 + (g/n)/((l/n)||1)));
        },
        bb: (data, n) => {
            if (data.length < n) return {u:0, l:0, m:0};
            let s = data.slice(-n); let m = s.reduce((a,b)=>a+b)/n;
            let sd = Math.sqrt(s.map(x=>Math.pow(x-m,2)).reduce((a,b)=>a+b)/n);
            return {u: m+(sd*2), l: m-(sd*2), m: m};
        }
    };

    // --- WAKE LOCK (KEEP SCREEN ON) ---
    let wakeLock = null;
    const requestWakeLock = async () => {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                log("WAKE_LOCK: ACTIVE (SCREEN ON)", "sys");
            }
        } catch (err) { console.error(`${err.name}, ${err.message}`); }
    };

    function log(msg, type = '') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        const cont = document.getElementById('log-container');
        cont.prepend(div);
        if (cont.children.length > 50) cont.lastChild.remove();
    }

    async function sync() {
        db.ref('orakel_v4_state').set({
            balance: state.balance,
            position: state.position,
            speedMode: state.speedMode,
            lastSync: Date.now()
        });
    }

    function trade(side, price) {
        if (side === 'BUY' || side === 'SHORT') {
            state.position = { price: price, amount: state.balance / price, type: side };
            state.balance = 0;
            const colorClass = side === 'BUY' ? 'buy' : 'short';
            log(`>>> EXECUTE_${side}: BTC @ ${price.toFixed(2)}`, colorClass);
        } else if (side === 'CLOSE') {
            const pos = state.position;
            let finalBal;
            if (pos.type === 'BUY') {
                finalBal = pos.amount * price;
            } else {
                const profit = (pos.price - price) * pos.amount;
                finalBal = (pos.amount * pos.price) + profit;
            }
            state.balance = finalBal;
            log(`<<< CLOSE_${pos.type}: BTC @ ${price.toFixed(2)}. BAL: $${state.balance.toFixed(2)}`, 'sys');
            state.position = null;
        }
        sync();
        updateBalanceColor();
    }

    function updateBalanceColor() {
        const balEl = document.getElementById('balance');
        balEl.className = 'big-val';
        if (!state.position) {
            balEl.classList.add('status-fiat');
        } else if (state.position.type === 'BUY') {
            balEl.classList.add('status-long');
        } else {
            balEl.classList.add('status-short');
        }
    }

    function brain() {
        const p = parseFloat(document.getElementById('price').innerText);
        if (!p || p === 0) return;

        state.prices.push(p);
        if (state.prices.length > 300) state.prices.shift();

        const conf = SpeedProfiles[state.speedMode];
        if (state.prices.length < conf.emaS) return;

        const emaF = MathCore.ema(state.prices, conf.emaF);
        const emaS = MathCore.ema(state.prices, conf.emaS);
        const rsi = MathCore.rsi(state.prices, conf.rsiP);
        const bb = MathCore.bb(state.prices, conf.bbP);

        // UI Indicators
        document.getElementById('ind-ema').className = `chip ${emaF > emaS ? 'active' : ''}`;
        document.getElementById('ind-rsi').className = `chip ${rsi > 50 && rsi < 70 ? 'active' : ''}`;
        document.getElementById('ind-bb').className = `chip ${p > bb.u ? 'active' : ''}`;

        // Decision Logic (Always-in-Market)
        if (!state.position) {
            if (emaF > emaS && p > bb.u && rsi > 52) trade('BUY', p);
            else if (emaF < emaS && p < bb.l && rsi < 48) trade('SHORT', p);
        } else {
            const pos = state.position;
            if (pos.type === 'BUY') {
                if (emaF < emaS || rsi > 75 || p < bb.m) trade('CLOSE', p);
            } else {
                if (emaF > emaS || rsi < 25 || p > bb.m) trade('CLOSE', p);
            }
        }
    }

    // Slider
    const slider = document.getElementById('speed-slider');
    slider.oninput = function() {
        state.speedMode = this.value;
        const conf = SpeedProfiles[this.value];
        document.getElementById('speed-label').innerText = conf.label;
        document.getElementById('mode-text').innerText = conf.name;
        log(`MODE_SHIFT: ${conf.name} ACTIVATED`, 'sys');
        clearInterval(window.brainTimer);
        window.brainTimer = setInterval(brain, conf.interval);
        sync();
    };

    // Binance
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');
    ws.onmessage = (e) => {
        const p = parseFloat(JSON.parse(e.data).c);
        document.getElementById('price').innerText = p.toFixed(2);
        
        if (state.position) {
            const pos = state.position;
            let pnl = (pos.type === 'BUY') ? ((p / pos.price - 1) * 100) : ((pos.price / p - 1) * 100);
            document.getElementById('pnl-val').innerText = pnl.toFixed(2) + "%";
            document.getElementById('pnl-val').style.color = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            document.getElementById('balance').innerText = `$${((pos.type === 'BUY' ? pos.amount * p : (pos.amount * pos.price) + (pos.price - p) * pos.amount)).toFixed(2)}`;
            document.getElementById('pos-type').innerText = pos.type;
        } else {
            document.getElementById('balance').innerText = `$${state.balance.toFixed(2)}`;
            document.getElementById('pos-type').innerText = "FLAT";
        }
    };

    window.onload = () => {
        requestWakeLock();
        db.ref('orakel_v4_state').once('value').then(s => {
            const d = s.val();
            if (d) {
                state.balance = d.balance || 10000;
                state.position = d.position || null;
                state.speedMode = d.speedMode || 3;
                slider.value = state.speedMode;
                slider.oninput();
                updateBalanceColor();
            }
            log("ORACLE_CORE_V4: ONLINE. DATABASE_LINK: STABLE.", "sys");
        });
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
        
        // Re-request wake lock if tab is switched back
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        });
    };
</script>
</body>
</html>
