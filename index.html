<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIT-ORAKUL V7.4 // ECO_UNITY_LOGGER</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #fff200;
            --bg-dark: #050505;
            --panel-bg: rgba(0, 243, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-transform: uppercase;
        }

        /* Эффект сканирования (CRT) */
        body::before {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px; pointer-events: none; z-index: 1000;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 5px; margin-bottom: 10px; font-size: 9px;
        }

        .node-stack { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }

        .node {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            padding: 12px; position: relative;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        .node-label { 
            font-size: 8px; color: var(--neon-magenta); 
            margin-bottom: 4px; display: flex; justify-content: space-between; 
        }
        
        .big-val { font-size: 1.8rem; font-weight: bold; transition: all 0.2s ease; }
        
        /* Цвета статусов */
        .status-fiat { color: var(--neon-yellow) !important; text-shadow: 0 0 10px var(--neon-yellow); }
        .status-long { color: var(--neon-green) !important; text-shadow: 0 0 10px var(--neon-green); }
        .status-short { color: var(--neon-red) !important; text-shadow: 0 0 10px var(--neon-red); }
        .status-close { color: var(--neon-yellow) !important; }

        .indicator-row { display: flex; gap: 5px; margin-top: 5px; }
        
        .chip { 
            font-size: 7px; border: 1px solid #333; padding: 2px 4px; 
            color: #444; transition: 0.3s; 
        }
        .chip.buy { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .chip.sell { border-color: var(--neon-red); color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }
        .chip.neutral { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        /* Контейнер истории в Ledger */
        .history-line {
            display: flex; gap: 8px; font-size: 7px; overflow: hidden;
            flex-direction: row-reverse; justify-content: flex-start;
            flex-grow: 1; margin-right: 10px;
        }
        .hist-item { white-space: nowrap; border-right: 1px solid #333; padding-right: 8px; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

        .btn {
            background: none; border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); font-family: inherit;
            padding: 8px; cursor: pointer; font-weight: bold; font-size: 10px;
        }

        #stop-btn { border-color: var(--neon-red); color: var(--neon-red); }
        #stop-btn.active { background: var(--neon-red); color: black; box-shadow: 0 0 15px var(--neon-red); }

        .master-box {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 9px; padding: 5px; border: 1px dashed var(--neon-magenta);
        }

        input[type=range] { width: 100%; accent-color: var(--neon-magenta); margin: 5px 0; }

        #terminal {
            flex-grow: 1; margin-top: 10px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--neon-magenta);
            padding: 10px; overflow-y: auto;
            font-size: 9px; line-height: 1.3;
        }

        .log { margin-bottom: 4px; border-left: 2px solid var(--neon-cyan); padding-left: 6px; }
        .log-sub { margin-bottom: 6px; font-size: 8px; padding-left: 10px; opacity: 0.9; }
        
        .buy-log { color: var(--neon-green); border-color: var(--neon-green); }
        .sell-log { color: var(--neon-red); border-color: var(--neon-red); }
        .close-log { color: var(--neon-yellow); border-color: var(--neon-yellow); }
        .sys-log { color: #888; border-color: #444; }

        #online-count { color: var(--neon-green); font-weight: bold; }
        .eco-badge { color: var(--neon-yellow); display: none; margin-left: 5px; }
    </style>
</head>
<body>

<header>
    <div>NET: <span id="online-count">1</span> NODES // <span id="net-status">SYNC</span><span id="eco-badge" class="eco-badge">[ECO]</span></div>
    <div id="sys-clock">00:00:00</div>
</header>

<div class="node-stack">
    <div class="node">
        <div class="node-label">
            <span>MARKET_CORE: BTC/USDT</span>
            <span id="last-update">--:--:--</span>
        </div>
        <div id="price" class="big-val">00000.00</div>
        <div class="indicator-row">
            <div id="ind-ema" class="chip">EMA_X</div>
            <div id="ind-rsi" class="chip">RSI_VOL</div>
            <div id="ind-bb" class="chip">BB_REVERSE</div>
        </div>
    </div>

    <div class="node">
        <div class="node-label">LEDGER_STATE: FIREBASE_CLOUD</div>
        <div id="balance" class="big-val status-fiat">$10,000.00</div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px; font-size:10px;">
            <span>POS: <span id="pos-type">FLAT</span></span>
            <div id="history-box" class="history-line">
                </div>
            <span id="pnl-val" style="font-weight:bold;">0.00%</span>
        </div>
    </div>

    <div class="node">
        <div class="node-label">NEURAL_DYNAMICS</div>
        <div style="font-size: 8px;">VELOCITY: <span id="spd-lbl" style="color:var(--neon-magenta)">SWING</span></div>
        <input type="range" id="spd-sld" min="1" max="5" value="3">
        
        <div class="controls">
            <div class="master-box">
                <span>MASTER_BRAIN</span>
                <input type="checkbox" id="master-toggle" checked>
            </div>
            <button id="stop-btn" class="btn">STOP_AI</button>
        </div>
    </div>
</div>

<div id="terminal"></div>

<script>
    // --- 1. CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4",
        authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com",
        projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app",
        messagingSenderId: "664775878094",
        appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        balance: 10000,
        position: null,
        prices: [],
        speed: 3,
        running: true,
        isMaster: true,
        isEco: false,
        lastT: Date.now(),
        history: []
    };

    const Profiles = {
        1: { n: "SCALP", i: 2000, ef: 3, es: 7, r: 7, b: 10 },
        2: { n: "INTRADAY", i: 10000, ef: 8, es: 21, r: 14, b: 20 },
        3: { n: "SWING", i: 60000, ef: 12, es: 26, r: 14, b: 20 },
        4: { n: "TREND", i: 300000, ef: 20, es: 50, r: 21, b: 30 },
        5: { n: "HODL", i: 3600000, ef: 50, es: 200, r: 21, b: 50 }
    };

    // --- 2. AUDIO & MATH ---
    const aCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f = 440, d = 0.1) {
        try {
            if (aCtx.state === 'suspended') aCtx.resume();
            const o = aCtx.createOscillator(), g = aCtx.createGain();
            o.connect(g); g.connect(aCtx.destination);
            o.frequency.value = f; g.gain.setValueAtTime(0.05, aCtx.currentTime);
            o.start(); o.stop(aCtx.currentTime + d);
        } catch(e) {}
    }

    const MathCore = {
        ema: (d, n) => { let k = 2/(n+1), e = d[0]; for(let i=1;i<d.length;i++) e=d[i]*k+e*(1-k); return e; },
        rsi: (d, n) => {
            if(d.length<=n) return 50;
            let g=0, l=0; for(let i=d.length-n;i<d.length;i++){ let diff=d[i]-d[i-1]; if(diff>=0)g+=diff; else l-=diff; }
            return 100-(100/(1+(g/n)/((l/n)||1)));
        },
        bb: (d, n) => {
            if(d.length<n) return {u:0,m:0,l:0}; let s=d.slice(-n), m=s.reduce((a,b)=>a+b)/n;
            let sd=Math.sqrt(s.map(x=>Math.pow(x-m,2)).reduce((a,b)=>a+b)/n); return {u:m+(sd*2),m:m,l:m-(sd*2)};
        }
    };

    // --- 3. UI ENGINE ---
    function log(msg, type = '', isSub = false) {
        const t = document.getElementById('terminal');
        const d = document.createElement('div');
        d.className = isSub ? 'log-sub' : `log ${type}`;
        d.innerHTML = isSub ? `>> ${msg}` : `[${new Date().toLocaleTimeString([],{hour12:false})}] > ${msg}`;
        t.prepend(d); 
        if(t.children.length > 40) t.lastChild.remove();
    }

    function updateHistoryUI() {
        const box = document.getElementById('history-box');
        box.innerHTML = '';
        state.history.slice(-3).forEach(h => {
            const span = document.createElement('div');
            span.className = 'hist-item';
            const color = h.pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            span.innerHTML = `${h.type} <span style="color:${color}">${h.pnl.toFixed(1)}%</span>`;
            box.appendChild(span);
        });
    }

    function updateBalanceUI(p) {
        const balEl = document.getElementById('balance');
        if (state.position) {
            const pos = state.position;
            const pnl = (pos.type === 'LONG') ? ((p/pos.price-1)*100) : ((pos.price/p-1)*100);
            const curB = (pos.type === 'LONG') ? pos.amount * p : (pos.amount * pos.price + (pos.price - p) * pos.amount);
            balEl.innerText = `$${curB.toFixed(2)}`;
            balEl.className = 'big-val ' + (pos.type === 'LONG' ? 'status-long' : 'status-short');
            document.getElementById('pnl-val').innerText = pnl.toFixed(2) + "%";
            document.getElementById('pnl-val').style.color = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            document.getElementById('pos-type').innerText = pos.type;
        } else {
            balEl.innerText = `$${state.balance.toFixed(2)}`;
            balEl.className = 'big-val status-fiat';
            document.getElementById('pnl-val').innerText = "0.00%";
            document.getElementById('pnl-val').style.color = 'var(--neon-cyan)';
            document.getElementById('pos-type').innerText = "FLAT";
        }
    }

    // --- 4. TRADING & BRAIN ---
    function trade(side, price) {
        if (!state.isMaster) return;

        if (side === 'LONG' || side === 'SHORT') {
            state.position = { price, amount: (state.balance || 10000)/price, type: side };
            state.balance = 0;
            log(`EXECUTE_${side}: ${price.toFixed(2)}`, side.toLowerCase()+'-log');
            beep(880);
        } 
        else if (side === 'CLOSE') {
            const p = state.position; if(!p) return;
            const pnl = (p.type==='LONG') ? ((price/p.price-1)*100) : ((p.price/price-1)*100);
            state.balance = (p.type==='LONG')? p.amount * price : (p.amount * p.price + (p.price - price) * p.amount);
            
            // Логирование закрытия
            log(`CLOSED_${p.type}: BAL $${state.balance.toFixed(2)}`, 'close-log');
            const pnlColor = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            log(`ENTRY: ${p.price.toFixed(2)} | EXIT: ${price.toFixed(2)} | PNL: <span style="color:${pnlColor}">${pnl.toFixed(2)}%</span>`, '', true);
            
            // Обновление истории
            state.history.push({ type: p.type, pnl: pnl });
            if(state.history.length > 5) state.history.shift();
            updateHistoryUI();
            
            state.position = null; 
            beep(440);
        }
        
        db.ref('orakel_v7_final').set({ 
            bal: state.balance, 
            pos: state.position, 
            run: state.running, 
            spd: state.speed, 
            lastP: price, 
            hist: state.history,
            time: Date.now() 
        });
    }

    function brain() {
        const p = parseFloat(document.getElementById('price').innerText);
        if (!p || isNaN(p) || !state.isMaster) return;

        state.prices.push(p); if(state.prices.length > 300) state.prices.shift();
        const c = Profiles[state.speed]; if(state.prices.length < c.es) return;

        const ef=MathCore.ema(state.prices,c.ef), es=MathCore.ema(state.prices,c.es), r=MathCore.rsi(state.prices,c.r), bb=MathCore.bb(state.prices,c.b);
        const th = p * 0.0002;

        document.getElementById('ind-ema').className = 'chip ' + (ef > es + th ? 'buy' : (ef < es - th ? 'sell' : 'neutral'));
        document.getElementById('ind-rsi').className = 'chip ' + (r > 55 ? 'buy' : (r < 45 ? 'sell' : 'neutral'));
        document.getElementById('ind-bb').className = 'chip ' + (p < bb.l ? 'buy' : (p > bb.u ? 'sell' : 'neutral'));

        if (!state.running) return;

        if (!state.position) {
            if (ef > es + th && r > 52) trade('LONG', p);
            else if (ef < es - th && r < 48) trade('SHORT', p);
        } else {
            if (state.position.type === 'LONG' && ef < es - th) { trade('CLOSE', p); trade('SHORT', p); }
            else if (state.position.type === 'SHORT' && ef > es + th) { trade('CLOSE', p); trade('LONG', p); }
        }
    }

    // --- 5. NETWORK & ECO ---
    let ws;
    function initNet() {
        if (state.isEco && !state.isMaster) return;
        ws = new WebSocket('wss://stream.binance.com:443/ws/btcusdt@ticker');
        const st = document.getElementById('net-status');
        ws.onopen = () => { st.innerText = "ONLINE"; st.style.color = "var(--neon-green)"; log("LINK: BINANCE_ACTIVE", "sys-log"); };
        ws.onmessage = (e) => {
            const d = JSON.parse(e.data), p = parseFloat(d.c);
            state.lastT = Date.now();
            document.getElementById('price').innerText = p.toFixed(2);
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString([],{hour12:false});
            updateBalanceUI(p);
        };
        ws.onclose = () => { 
            st.innerText = "LOST"; st.style.color = "var(--neon-red)"; 
            if (!state.isEco) setTimeout(initNet
