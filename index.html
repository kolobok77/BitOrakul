<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIT-ORAKUL V8.0 // OMNI_ENGINE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #fff200;
            --bg-dark: #050505;
            --panel-bg: rgba(0, 243, 255, 0.07);
            --font-main: 'Courier New', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: var(--font-main);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-transform: uppercase;
        }

        /* CRT Effect */
        body::before {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 1000;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 5px; margin-bottom: 10px; font-size: 9px;
        }

        .node-stack { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }

        .node {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            padding: 12px; position: relative;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        .node-label { 
            font-size: 8px; color: var(--neon-magenta); 
            margin-bottom: 4px; display: flex; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 0, 255, 0.2);
        }
        
        .big-val { font-size: 1.8rem; font-weight: bold; transition: all 0.2s ease; }
        .status-fiat { color: var(--neon-yellow) !important; text-shadow: 0 0 10px var(--neon-yellow); }
        .status-long { color: var(--neon-green) !important; text-shadow: 0 0 10px var(--neon-green); }
        .status-short { color: var(--neon-red) !important; text-shadow: 0 0 10px var(--neon-red); }

        .indicator-row { display: flex; gap: 5px; margin-top: 5px; align-items: center; }
        
        .chip { 
            font-size: 7px; border: 1px solid #333; padding: 2px 4px; 
            color: #444; transition: 0.3s; background: rgba(0,0,0,0.3);
        }
        .chip.buy { border-color: var(--neon-green); color: var(--neon-green); }
        .chip.sell { border-color: var(--neon-red); color: var(--neon-red); }
        .chip.active { border-color: var(--neon-yellow); color: var(--neon-yellow); }

        /* Decision Bar */
        .decision-wrapper { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; margin-left: 10px; }
        .decision-container { height: 10px; background: #000; border: 1px solid #333; position: relative; overflow: hidden; }
        #decision-bar { height: 100%; width: 0%; background: var(--neon-magenta); transition: width 0.3s ease; }
        .dec-text { font-size: 6px; color: var(--neon-magenta); display: flex; justify-content: space-between; }

        .history-line { display: flex; gap: 8px; font-size: 7px; overflow: hidden; flex-direction: row-reverse; }
        .hist-item { border-left: 1px solid #333; padding-left: 8px; white-space: nowrap; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn {
            background: none; border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); font-family: inherit;
            padding: 8px; cursor: pointer; font-size: 10px; font-weight: bold;
        }
        #stop-btn.active { background: var(--neon-red); color: black; border-color: var(--neon-red); }

        /* Sliders */
        .slider-group { display: flex; flex-direction: column; gap: 2px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 7px; align-items: center; }
        .opt-tag { font-size: 6px; background: var(--neon-yellow); color: black; padding: 0 3px; border-radius: 2px; visibility: hidden; }
        input[type=range] { width: 100%; accent-color: var(--neon-magenta); margin: 5px 0; cursor: pointer; }

        #terminal {
            flex-grow: 1; margin-top: 10px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--neon-magenta);
            padding: 10px; overflow-y: auto;
            font-size: 9px; line-height: 1.2;
        }

        .log { margin-bottom: 3px; border-left: 2px solid var(--neon-cyan); padding-left: 6px; }
        .log-sub { margin-bottom: 5px; font-size: 8px; padding-left: 10px; color: #777; }
        .buy-log { color: var(--neon-green); }
        .sell-log { color: var(--neon-red); }
        .sys-log { color: #555; }
    </style>
</head>
<body>

<header>
    <div>NET: <span id="online-count">1</span> NODES // <span id="net-status">SYNC</span></div>
    <div id="sys-clock">00:00:00</div>
</header>

<div class="node-stack">
    <div class="node">
        <div class="node-label">
            <span>CORE_FEED // <span id="engine-tag" style="color:var(--neon-yellow)">...</span></span>
            <span id="last-update">--:--:--</span>
        </div>
        <div id="price" class="big-val">00000.00</div>
        <div class="indicator-row">
            <div id="ind-1" class="chip">SIG_A</div>
            <div id="ind-2" class="chip">SIG_B</div>
            <div id="ind-3" class="chip">SIG_C</div>
            <div class="decision-wrapper">
                <div class="dec-text"><span>DECISION_POWER</span><span id="dec-val">0%</span></div>
                <div class="decision-container"><div id="decision-bar"></div></div>
            </div>
        </div>
    </div>

    <div class="node">
        <div class="node-label">FINANCIAL_LEDGER</div>
        <div id="balance" class="big-val status-fiat">$10,000.00</div>
        <div style="display:flex; justify-content:space-between; margin-top:5px; font-size:9px;">
            <span>POS: <span id="pos-type">FLAT</span></span>
            <div id="history-box" class="history-line"></div>
            <span id="pnl-val">0.00%</span>
        </div>
    </div>

    <div class="node">
        <div class="node-label">OMNI_ENGINE_DYNAMICS</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="slider-group">
                <div class="slider-header"><span>VELOCITY (MODE)</span><span id="spd-lbl">SWING</span></div>
                <input type="range" id="spd-sld" min="1" max="5" value="3">
            </div>
            <div class="slider-group">
                <div class="slider-header">
                    <span>HYSTERESIS</span>
                    <span id="opt-hint" class="opt-tag">OPTIMAL</span>
                    <span id="hst-lbl">0.02%</span>
                </div>
                <input type="range" id="hst-sld" min="1" max="200" value="40">
            </div>
        </div>
        <div class="controls">
            <div style="border: 1px dashed var(--neon-magenta); padding: 5px; font-size: 8px; display: flex; justify-content: space-between; align-items: center; width:100%;">
                <span>MASTER_BRAIN</span>
                <input type="checkbox" id="master-toggle" checked>
            </div>
            <button id="stop-btn" class="btn">STOP_AI</button>
        </div>
    </div>
</div>

<div id="terminal"></div>

<script>
    // --- 1. CONFIG & STATE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4",
        authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com",
        projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app",
        messagingSenderId: "664775878094",
        appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        balance: 10000,
        position: null,
        prices: [],
        speed: 3,
        hysteresis: 0.0004,
        running: true,
        isMaster: true,
        lastT: Date.now(),
        history: []
    };

    const Profiles = {
        1: { n: "SCALP", i: 2000, ohst: 0.00015, logic: "REVERSION", buf: 100 },
        2: { n: "INTRADAY", i: 10000, ohst: 0.00035, logic: "MOMENTUM", buf: 200 },
        3: { n: "SWING", i: 60000, ohst: 0.00055, logic: "TREND_FOLLOW", buf: 500 },
        4: { n: "TREND", i: 300000, ohst: 0.00080, logic: "MACD_SHIFT", buf: 600 },
        5: { n: "HODL", i: 3600000, ohst: 0.00120, logic: "GOLDEN_CROSS", buf: 1000 }
    };

    // --- 2. MATH CORE ---
    const MathCore = {
        ema: (d, n) => { 
            if (d.length < n) return d[d.length-1];
            let k = 2/(n+1), e = d[d.length-n]; 
            for(let i=d.length-n+1; i<d.length; i++) e = d[i]*k+e*(1-k); 
            return e; 
        },
        rsi: (d, n) => {
            if(d.length <= n) return 50;
            let g=0, l=0; for(let i=d.length-n; i<d.length; i++) {
                let diff = d[i]-d[i-1]; if(diff>=0) g+=diff; else l-=diff;
            }
            return 100-(100/(1+(g/n)/((l/n)||1)));
        },
        bb: (d, n) => {
            if(d.length < n) return {u:0, m:0, l:0};
            let s = d.slice(-n), m = s.reduce((a,b)=>a+b)/n;
            let sd = Math.sqrt(s.map(x=>Math.pow(x-m,2)).reduce((a,b)=>a+b)/n);
            return { u: m+(sd*2), m: m, l: m-(sd*2) };
        }
    };

    // --- 3. UI ENGINE ---
    function log(msg, type='', sub=false) {
        const t = document.getElementById('terminal'), d = document.createElement('div');
        d.className = sub ? 'log-sub' : `log ${type}`;
        d.innerHTML = sub ? `>> ${msg}` : `[${new Date().toLocaleTimeString([],{hour12:false})}] ${msg}`;
        t.prepend(d); if(t.children.length > 50) t.lastChild.remove();
    }

    function updateUI(p) {
        const balEl = document.getElementById('balance');
        const pnlEl = document.getElementById('pnl-val');
        if (state.position) {
            const pos = state.position;
            const pnl = (pos.type === 'LONG') ? ((p/pos.price-1)*100) : ((1-p/pos.price)*100);
            const curB = (pos.type === 'LONG') ? pos.amount * p : (pos.amount * pos.price + (pos.price - p) * pos.amount);
            balEl.innerText = `$${curB.toFixed(2)}`;
            balEl.className = 'big-val ' + (pnl >= 0 ? 'status-long' : 'status-short');
            pnlEl.innerText = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + "%";
            pnlEl.style.color = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
            document.getElementById('pos-type').innerText = pos.type;
        } else {
            balEl.innerText = `$${state.balance.toFixed(2)}`;
            balEl.className = 'big-val status-fiat';
            pnlEl.innerText = "0.00%";
            document.getElementById('pos-type').innerText = "FLAT";
        }
        
        // Check Optimal Hysteresis UI
        const currentOHst = Profiles[state.speed].ohst;
        const diff = Math.abs(state.hysteresis - currentOHst);
        document.getElementById('opt-hint').style.visibility = diff < 0.00005 ? 'visible' : 'hidden';
    }

    // --- 4. TRADING ENGINE ---
    function trade(side, price) {
        if (!state.isMaster) return;
        if (side === 'LONG' || side === 'SHORT') {
            state.position = { price, amount: (state.balance || 10000)/price, type: side };
            state.balance = 0;
            log(`EXECUTE_${side}: ${price.toFixed(2)}`, side.toLowerCase()+'-log');
        } else if (side === 'CLOSE') {
            const p = state.position; if(!p) return;
            const pnl = (p.type==='LONG') ? ((price/p.price-1)*100) : ((1-price/p.price)*100);
            state.balance = (p.type==='LONG')? p.amount * price : (p.amount * p.price + (p.price - price) * p.amount);
            log(`CLOSED_${p.type} | PNL: ${pnl.toFixed(2)}%`, 'sys-log');
            state.history.push({ type: p.type, pnl });
            if(state.history.length > 5) state.history.shift();
            state.position = null;
        }
        db.ref('orakel_v7_final').set({ bal: state.balance, pos: state.position, run: state.running, spd: state.speed, hst: state.hysteresis, lastP: price, hist: state.history, time: Date.now() });
    }

    // --- 5. OMNI_BRAIN LOGIC ---
    function brain() {
        const p = parseFloat(document.getElementById('price').innerText);
        if (!p || isNaN(p) || !state.isMaster) return;

        const conf = Profiles[state.speed];
        state.prices.push(p); if(state.prices.length > conf.buf) state.prices.shift();
        if(state.prices.length < 50) return;

        document.getElementById('engine-tag').innerText = conf.logic;
        let dec = 0; // Decision Power 0-100
        const th = p * state.hysteresis;

        // Reset chips
        const chips = [document.getElementById('ind-1'), document.getElementById('ind-2'), document.getElementById('ind-3')];
        chips.forEach(c => c.className = 'chip');

        // MULTI-STRATEGY ROUTING
        switch(conf.logic) {
            case "REVERSION": // SCALP
                const bb = MathCore.bb(state.prices, 20);
                const rsiS = MathCore.rsi(state.prices, 7);
                chips[0].innerText = "BB_TOUCH"; chips[0].className += (p >= bb.u || p <= bb.l) ? ' active' : '';
                chips[1].innerText = "RSI_EXT"; chips[1].className += (rsiS > 70 || rsiS < 30) ? ' active' : '';
                dec = Math.max(0, Math.min(100, (Math.abs(rsiS - 50) - 20) * 3.3));
                if (!state.position) {
                    if (p <= bb.l && rsiS < 30) trade('LONG', p);
                    else if (p >= bb.u && rsiS > 70) trade('SHORT', p);
                } else {
                    if (state.position.type === 'LONG' && p >= bb.m) trade('CLOSE', p);
                    else if (state.position.type === 'SHORT' && p <= bb.m) trade('CLOSE', p);
                }
                break;

            case "MOMENTUM": // INTRADAY
                const e8 = MathCore.ema(state.prices, 8);
                const e21 = MathCore.ema(state.prices, 21);
                const rsiI = MathCore.rsi(state.prices, 14);
                chips[0].innerText = "EMA_CROSS"; chips[0].className += (Math.abs(e8-e21) > th) ? ' active' : '';
                chips[1].innerText = "MOMENTUM"; chips[1].className += (rsiI > 55 || rsiI < 45) ? ' active' : '';
                dec = Math.min(100, (Math.abs(e8 - e21) / (th || 1)) * 100);
                if (!state.position) {
                    if (e8 > e21 + th && rsiI > 52) trade('LONG', p);
                    else if (e8 < e21 - th && rsiI < 48) trade('SHORT', p);
                } else {
                    if (state.position.type === 'LONG' && e8 < e21) trade('CLOSE', p);
                    else if (state.position.type === 'SHORT' && e8 > e21) trade('CLOSE', p);
                }
                break;

            case "TREND_FOLLOW": // SWING
                const efS = MathCore.ema(state.prices, 12);
                const esS = MathCore.ema(state.prices, 26);
                const e200 = MathCore.ema(state.prices, 200);
                chips[0].innerText = "MAIN_TREND"; chips[0].className += (p > e200) ? ' buy' : ' sell';
                chips[1].innerText = "WAVE_CROSS"; chips[1].className += (efS > esS) ? ' buy' : ' sell';
                dec = Math.min(100, (Math.abs(efS - esS) / (th || 1)) * 80);
                if (!state.position) {
                    if (p > e200 && efS > esS + th) trade('LONG', p);
                    else if (p < e200 && efS < esS - th) trade('SHORT', p);
                } else {
                    if (state.position.type === 'LONG' && efS < esS) trade('CLOSE', p);
                    else if (state.position.type === 'SHORT' && efS > esS) trade('CLOSE', p);
                }
                break;

            case "MACD_SHIFT": // TREND
                const ma12 = MathCore.ema(state.prices, 12);
                const ma26 = MathCore.ema(state.prices, 26);
                const macd = ma12 - ma26;
                chips[0].innerText = "MACD_VAL"; chips[0].className += macd > 0 ? ' buy' : ' sell';
                dec = Math.min(100, (Math.abs(macd) / (p*0.001)) * 1000);
                if (!state.position) {
                    if (macd > th/10) trade('LONG', p);
                    else if (macd < -th/10) trade('SHORT', p);
                } else {
                    if (state.position.type === 'LONG' && macd < 0) trade('CLOSE', p);
                    else if (state.position.type === 'SHORT' && macd > 0) trade('CLOSE', p);
                }
                break;

            case "GOLDEN_CROSS": // HODL
                const fastH = MathCore.ema(state.prices, 50);
                const slowH = MathCore.ema(state.prices, 200);
                chips[0].innerText = "GOLD_CROSS"; chips[0].className += fastH > slowH ? ' buy' : ' sell';
                dec = fastH > slowH ? 100 : 10;
                if (!state.position && fastH > slowH + th) trade('LONG', p);
                else if (state.position && fastH < slowH) trade('CLOSE', p);
                break;
        }

        // Decision UI
        document.getElementById('decision-bar').style.width = dec + "%";
        document.getElementById('dec-val').innerText = Math.round(dec) + "%";
    }

    // --- 6. SYNC & NET ---
    let ws;
    function initNet() {
        ws = new WebSocket('wss://stream.binance.com:443/ws/btcusdt@ticker');
        ws.onmessage = (e) => {
            const d = JSON.parse(e.data), p = parseFloat(d.c);
            state.lastT = Date.now();
            document.getElementById('price').innerText = p.toFixed(2);
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
            updateUI(p);
        };
        ws.onclose = () => setTimeout(initNet, 3000);
    }

    db.ref('orakel_v7_final').on('value', (s) => {
        const d = s.val(); if (!d) return;
        state.balance = d.bal; state.position = d.pos; state.running = d.run;
        if (state.speed != d.spd) {
            state.speed = d.spd; document.getElementById('spd-sld').value = d.spd;
            document.getElementById('spd-lbl').innerText = Profiles[d.spd].n;
            // Auto-snap Hysteresis on mode change
            state.hysteresis = Profiles[d.spd].ohst;
            if (state.isMaster) { clearInterval(window.bT); window.bT = setInterval(brain, Profiles[d.spd].i); }
        }
        if (d.hst) {
            state.hysteresis = d.hst;
            document.getElementById('hst-sld').value = d.hst * 100000;
            document.getElementById('hst-lbl').innerText = (d.hst * 100).toFixed(3) + "%";
        }
        document.getElementById('stop-btn').className = state.running ? 'btn' : 'btn active';
    });

    const pRef = db.ref('presence_v7').push(); pRef.onDisconnect().remove(); pRef.set(true);
    db.ref('presence_v7').on('value', (s) => document.getElementById('online-count').innerText = s.numChildren());

    // --- 7. INPUTS ---
    document.getElementById('spd-sld').oninput = function() {
        const newSpd = parseInt(this.value);
        db.ref('orakel_v7_final').update({ spd: newSpd, hst: Profiles[newSpd].ohst });
    };

    document.getElementById('hst-sld').oninput = function() {
        db.ref('orakel_v7_final').update({ hst: parseFloat(this.value)/100000 });
    };

    document.getElementById('stop-btn').onclick = () => {
        const p = parseFloat(document.getElementById('price').innerText);
        if (state.running && state.position) trade('CLOSE', p);
        db.ref('orakel_v7_final').update({ run: !state.running });
    };

    document.getElementById('master-toggle').onchange = function() {
        state.isMaster = this.checked;
        if (state.isMaster) window.bT = setInterval(brain, Profiles[state.speed].i);
        else clearInterval(window.bT);
    };

    window.onload = () => {
        initNet();
        setInterval(() => document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString(), 1000);
        log("OMNI_ENGINE_V8.0_ONLINE", "sys-log");
    };
</script>
</body>
</html>
