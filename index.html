<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIT-ORAKUL V8.2 // OMNI_CORE_SUPREME</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #fff200;
            --bg-dark: #050505;
            --panel-bg: rgba(0, 243, 255, 0.07);
            --font-main: 'Courier New', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: var(--font-main);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            text-transform: uppercase;
        }

        body::before {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 1000;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 8px; margin-bottom: 15px; font-size: 10px;
            letter-spacing: 1px;
        }

        .node-stack { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }

        .node {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            padding: 15px; position: relative;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .node-label { 
            font-size: 9px; color: var(--neon-magenta); 
            margin-bottom: 6px; display: flex; justify-content: space-between;
            font-weight: bold; border-bottom: 1px solid rgba(255, 0, 255, 0.2);
            padding-bottom: 3px;
        }
        
        .big-val { font-size: 2.2rem; font-weight: bold; transition: all 0.2s ease; letter-spacing: -1px; }
        
        .status-fiat { color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); }
        .status-long { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .status-short { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

        .indicator-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
        
        .chip { 
            font-size: 8px; border: 1px solid #333; padding: 3px 8px; 
            color: #444; transition: 0.3s; background: rgba(0,0,0,0.3);
        }
        .chip.active-buy { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .chip.active-sell { border-color: var(--neon-red); color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }

        .decision-wrapper { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; margin-left: 10px; }
        .decision-container {
            height: 14px; background: rgba(0,0,0,0.5); 
            border: 1px solid #333; position: relative; overflow: hidden;
        }
        #decision-bar {
            height: 100%; width: 0%; background: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta); transition: width 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        .dec-text { font-size: 7px; color: var(--neon-magenta); letter-spacing: 1px; }

        .history-line {
            display: flex; gap: 10px; font-size: 8px; overflow: hidden;
            flex-direction: row-reverse; justify-content: flex-start;
            flex-grow: 1; margin: 0 20px;
        }
        .hist-item { white-space: nowrap; border-left: 1px solid #333; padding-left: 10px; display: flex; flex-direction: column; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .slider-group { display: flex; flex-direction: column; gap: 6px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 9px; }
        
        input[type=range] { 
            width: 100%; accent-color: var(--neon-magenta); margin: 8px 0; cursor: pointer;
            background: #222; height: 4px; border-radius: 2px;
        }

        .btn {
            background: none; border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); font-family: inherit;
            padding: 10px; cursor: pointer; font-weight: bold; font-size: 11px;
            transition: 0.2s;
        }
        .btn:active { background: var(--neon-cyan); color: black; }
        #stop-btn.active { background: var(--neon-red); color: black; border-color: var(--neon-red); box-shadow: 0 0 20px var(--neon-red); }

        #terminal {
            flex-grow: 1; margin-top: 15px;
            background: rgba(0,0,0,0.95);
            border: 1px solid var(--neon-magenta);
            padding: 12px; overflow-y: auto;
            font-size: 10px; line-height: 1.4;
        }

        .log { margin-bottom: 5px; border-left: 3px solid var(--neon-cyan); padding-left: 10px; }
        .log-sub { margin-bottom: 8px; font-size: 9px; padding-left: 15px; opacity: 0.7; color: #888; }
        .buy-log { color: var(--neon-green); border-color: var(--neon-green); }
        .sell-log { color: var(--neon-red); border-color: var(--neon-red); }
        .close-log { color: var(--neon-yellow); border-color: var(--neon-yellow); }
    </style>
</head>
<body>

<header>
    <div>NET: <span id="online-count">1</span> NODES // <span id="net-status">WDE_ACTIVE</span></div>
    <div id="sys-clock">00:00:00</div>
</header>

<div class="node-stack">
    <div class="node">
        <div class="node-label">
            <span>CORE_FEED // <span id="active-logic-tag" style="color:var(--neon-yellow)">CALIBRATING...</span></span>
            <span id="last-update">--:--:--</span>
        </div>
        <div id="price" class="big-val">00000.00</div>
        <div class="indicator-row">
            <div id="ind-ema" class="chip">EMA_SCORE</div>
            <div id="ind-rsi" class="chip">RSI_SCORE</div>
            <div id="ind-vol" class="chip">BB_GAP</div>
            <div class="decision-wrapper">
                <span class="dec-text">DECISION_POWER (DP): <span id="dp-val">0%</span></span>
                <div class="decision-container"><div id="decision-bar"></div></div>
            </div>
        </div>
    </div>

    <div class="node">
        <div class="node-label">FINANCIAL_LEDGER // REALTIME_PNL</div>
        <div id="balance" class="big-val status-fiat">$10,000.00</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:11px;">
            <div>POS: <span id="pos-type" style="font-weight:bold; color:var(--neon-magenta)">FLAT</span></div>
            <div id="history-box" class="history-line"></div>
            <div id="pnl-val" style="font-weight:bold; font-size:16px;">0.00%</div>
        </div>
    </div>

    <div class="node">
        <div class="node-label">ADAPTIVE_ENGINE // SENSITIVITY</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <div class="slider-group">
                <div class="slider-header">
                    <span>MODE (WEIGHTS)</span>
                    <span id="spd-lbl" style="color:var(--neon-magenta)">SWING</span>
                </div>
                <input type="range" id="spd-sld" min="1" max="5" value="3">
            </div>
            <div class="slider-group">
                <div class="slider-header">
                    <span>HYSTERESIS GAP</span>
                    <span id="hst-lbl" style="color:var(--neon-yellow)">0.065%</span>
                </div>
                <input type="range" id="hst-sld" min="1" max="300" value="65">
            </div>
        </div>
        <div class="controls">
            <div style="border: 1px dashed var(--neon-magenta); padding: 5px 12px; font-size: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span>MASTER_BRAIN</span>
                <input type="checkbox" id="master-toggle" checked>
            </div>
            <button id="stop-btn" class="btn">KILL_PROCESS</button>
        </div>
    </div>
</div>

<div id="terminal"></div>

<script>
    // --- 1. CONFIG & STATE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4",
        authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com",
        projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app",
        messagingSenderId: "664775878094",
        appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const Profiles = {
        1: { n: "SCALP", i: 2000, weights: { rsi: 0.5, bb: 0.4, ema: 0.1 }, optH: 0.00018 },
        2: { n: "INTRADAY", i: 5000, weights: { rsi: 0.3, bb: 0.2, ema: 0.5 }, optH: 0.00035 },
        3: { n: "SWING", i: 10000, weights: { rsi: 0.2, bb: 0.2, ema: 0.6 }, optH: 0.00065 },
        4: { n: "TREND", i: 60000, weights: { rsi: 0.1, bb: 0.1, ema: 0.8 }, optH: 0.00150 },
        5: { n: "HODL", i: 300000, weights: { rsi: 0.05, bb: 0.05, ema: 0.9 }, optH: 0.00350 }
    };

    let state = {
        balance: 10000,
        position: null,
        prices: [],
        speed: 3,
        hysteresis: 0.00065,
        running: true,
        isMaster: true,
        lastTradeT: 0,
        history: [],
        currentDP: 0
    };

    // --- 2. MATH CORE & WDE ---
    const MathCore = {
        ema: (d, n) => { 
            if (d.length < n) return d[d.length-1];
            let k = 2/(n+1), e = d[d.length - n]; 
            for(let i = d.length - n + 1; i < d.length; i++) e = d[i] * k + e * (1 - k); 
            return e; 
        },
        rsi: (d, n) => {
            if(d.length <= n) return 50;
            let g=0, l=0; 
            for(let i=d.length-n; i<d.length; i++){ 
                let diff=d[i]-d[i-1]; if(diff>=0) g+=diff; else l-=diff; 
            }
            return 100-(100/(1+(g/n)/((l/n)||1)));
        },
        bb: (d, n) => {
            if(d.length < n) return {u:0, m:0, l:0};
            let s = d.slice(-n), m = s.reduce((a,b)=>a+b)/n;
            let sd = Math.sqrt(s.map(x=>Math.pow(x-m,2)).reduce((a,b)=>a+b)/n);
            return { u: m+(sd*2), m: m, l: m-(sd*2) };
        }
    };

    const WDE = {
        calculate(prices, speed, hst) {
            if (prices.length < 50) return { dp: 0, scores: { rsi: 0, ema: 0, bb: 0 } };
            const p = prices[prices.length - 1];
            const profile = Profiles[speed];
            const w = profile.weights;

            // RSI Component (-100 to 100)
            const rsiVal = MathCore.rsi(prices, 14);
            let rsiS = 0;
            if (rsiVal > 70) rsiS = -((rsiVal - 70) / 30) * 100;
            else if (rsiVal < 30) rsiS = ((30 - rsiVal) / 30) * 100;

            // EMA Component (-100 to 100)
            const e8 = MathCore.ema(prices, 8);
            const e21 = MathCore.ema(prices, 21);
            const th = p * hst;
            let emaS = ((e8 - e21) / (th || 1)) * 50;
            emaS = Math.max(-100, Math.min(100, emaS));

            // BB Component (-100 to 100)
            const bb = MathCore.bb(prices, 20);
            let bbS = 0;
            if (p >= bb.u) bbS = -100;
            else if (p <= bb.l) bbS = 100;
            else bbS = ((bb.m - p) / (bb.u - bb.m)) * 100;

            const totalDP = (rsiS * w.rsi) + (emaS * w.ema) + (bbS * w.bb);
            return {
                dp: Math.max(-100, Math.min(100, totalDP)),
                scores: { rsi: rsiS, ema: emaS, bb: bbS }
            };
        }
    };

    // --- 3. VISUAL ENGINE ---
    function refreshVisuals() {
        const p = parseFloat(document.getElementById('price').innerText);
        if (!p || state.prices.length < 10) return;

        const analysis = WDE.calculate(state.prices, state.speed, state.hysteresis);
        state.currentDP = analysis.dp;

        // Update Chips
        document.getElementById('ind-ema').className = 'chip ' + (analysis.scores.ema > 20 ? 'active-buy' : (analysis.scores.ema < -20 ? 'active-sell' : ''));
        document.getElementById('ind-rsi').className = 'chip ' + (analysis.scores.rsi > 20 ? 'active-buy' : (analysis.scores.rsi < -20 ? 'active-sell' : ''));
        document.getElementById('ind-vol').className = 'chip ' + (analysis.scores.bb > 20 ? 'active-buy' : (analysis.scores.bb < -20 ? 'active-sell' : ''));

        // Update DP Bar
        const dBar = document.getElementById('decision-bar');
        const dpVal = document.getElementById('dp-val');
        const absDP = Math.abs(analysis.dp);
        
        dBar.style.width = absDP + "%";
        let color = 'var(--neon-magenta)';
        if (analysis.dp > 20) color = 'var(--neon-green)';
        else if (analysis.dp < -20) color = 'var(--neon-red)';
        
        dBar.style.background = color;
        dBar.style.boxShadow = `0 0 15px ${color}`;
        dpVal.innerText = analysis.dp.toFixed(1) + "%";
        dpVal.style.color = color;
    }

    // --- 4. EXECUTION ---
    function log(msg, type='', sub=false) {
        const t = document.getElementById('terminal'), d = document.createElement('div');
        d.className = sub ? 'log-sub' : `log ${type}`;
        d.innerHTML = sub ? `>> ${msg}` : `[${new Date().toLocaleTimeString([],{hour12:false})}] ${msg}`;
        t.prepend(d); if(t.children.length > 30) t.lastChild.remove();
    }

    function trade(side, price) {
        if (!state.isMaster) return;
        if (side === 'LONG' || side === 'SHORT') {
            state.position = { price, amount: (state.balance || 10000)/price, type: side, t: Date.now() };
            state.balance = 0;
            log(`WDE_SIGNAL_${side} @ ${price.toFixed(2)}`, side.toLowerCase()+'-log');
        } else if (side === 'CLOSE') {
            const p = state.position; if(!p) return;
            const pnl = (p.type==='LONG') ? ((price/p.price-1)*100) : ((1-price/p.price)*100);
            state.balance = (p.type==='LONG')? p.amount * price : (p.amount * p.price + (p.price - price) * p.amount);
            
            log(`EXIT_SMART | PNL: ${pnl.toFixed(2)}%`, 'close-log');
            state.history.push({ type: p.type, pnl });
            if(state.history.length > 10) state.history.shift();
            state.position = null;
        }
        state.lastTradeT = Date.now();
        db.ref('orakel_v8').update({ 
            bal: state.balance, pos: state.position, run: state.running, 
            spd: state.speed, hst: state.hysteresis, hist: state.history 
        });
    }

    function brain() {
        const p = parseFloat(document.getElementById('price').innerText);
        if (!p || isNaN(p) || !state.isMaster) return;

        state.prices.push(p); if(state.prices.length > 1000) state.prices.shift();
        
        const analysis = WDE.calculate(state.prices, state.speed, state.hysteresis);
        const dp = analysis.dp;

        if (!state.running || (Date.now() - state.lastTradeT < 3000)) return;

        // ENTRY LOGIC (DP > 65%)
        if (!state.position) {
            if (dp > 65) trade('LONG', p);
            else if (dp < -65) trade('SHORT', p);
        } 
        // SMART EXIT (DP < 20%)
        else {
            if (state.position.type === 'LONG' && dp < 20) trade('CLOSE', p);
            else if (state.position.type === 'SHORT' && dp > -20) trade('CLOSE', p);
        }
    }

    // --- 5. NETWORK & SYNC ---
    function initNet() {
        const ws = new WebSocket('wss://stream.binance.com:443/ws/btcusdt@ticker');
        ws.onmessage = (e) => {
            const d = JSON.parse(e.data), p = parseFloat(d.c);
            document.getElementById('price').innerText = p.toFixed(2);
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
            
            const balEl = document.getElementById('balance');
            const pnlEl = document.getElementById('pnl-val');
            const posEl = document.getElementById('pos-type');

            if(state.position) {
                const pos = state.position;
                const pnl = (pos.type === 'LONG') ? ((p/pos.price-1)*100) : ((1-p/pos.price)*100);
                const curB = (pos.type === 'LONG') ? pos.amount * p : (pos.amount * pos.price + (pos.price - p) * pos.amount);
                balEl.innerText = `$${curB.toFixed(2)}`;
                balEl.className = 'big-val ' + (pnl >= 0 ? 'status-long' : 'status-short');
                pnlEl.innerText = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + "%";
                pnlEl.style.color = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
                posEl.innerText = pos.type;
                posEl.style.color = pos.type === 'LONG' ? 'var(--neon-green)' : 'var(--neon-red)';
            } else {
                balEl.innerText = `$${state.balance.toFixed(2)}`;
                balEl.className = 'big-val status-fiat';
                pnlEl.innerText = "0.00%"; pnlEl.style.color = "var(--neon-cyan)";
                posEl.innerText = "FLAT"; posEl.style.color = "var(--neon-magenta)";
            }
            refreshVisuals();
        };
        ws.onclose = () => setTimeout(initNet, 3000);
    }

    db.ref('orakel_v8').on('value', (s) => {
        const d = s.val(); if (!d) return;
        state.balance = d.bal || 10000; 
        state.position = d.pos || null; 
        state.running = d.run !== undefined ? d.run : true;
        
        if(d.hist) {
            state.history = d.hist;
            const box = document.getElementById('history-box');
            box.innerHTML = '';
            state.history.slice(-3).forEach(h => {
                const i = document.createElement('div'); i.className = 'hist-item';
                i.innerHTML = `<span style="color:#666">${h.type}</span><span style="color:${h.pnl>=0?'var(--neon-green)':'var(--neon-red)'}">${h.pnl.toFixed(1)}%</span>`;
                box.appendChild(i);
            });
        }

        if (state.speed != d.spd) {
            state.speed = d.spd || 3;
            document.getElementById('spd-sld').value = state.speed;
            document.getElementById('spd-lbl').innerText = Profiles[state.speed].n;
            document.getElementById('active-logic-tag').innerText = Profiles[state.speed].n + "_CORE";
            if (state.isMaster) { clearInterval(window.bT); window.bT = setInterval(brain, Profiles[state.speed].i); }
        }
        state.hysteresis = d.hst || 0.00065;
        document.getElementById('hst-sld').value = state.hysteresis * 100000;
        document.getElementById('hst-lbl').innerText = (state.hysteresis * 100).toFixed(3) + "%";

        const stopBtn = document.getElementById('stop-btn');
        if(!state.running) stopBtn.classList.add('active'); else stopBtn.classList.remove('active');
    });

    // --- 6. CONTROLS ---
    document.getElementById('spd-sld').oninput = function() {
        const n = parseInt(this.value);
        db.ref('orakel_v8').update({ spd: n, hst: Profiles[n].optH });
    };

    document.getElementById('hst-sld').oninput = function() {
        const h = parseFloat(this.value)/100000;
        db.ref('orakel_v8').update({ hst: h });
    };

    document.getElementById('stop-btn').onclick = function() {
        const p = parseFloat(document.getElementById('price').innerText);
        if (state.running && state.position) trade('CLOSE', p);
        db.ref('orakel_v8').update({ run: !state.running });
    };

    document.getElementById('master-toggle').onchange = function() {
        state.isMaster = this.checked;
        log(state.isMaster ? "NODE_PROMOTED_TO_MASTER" : "NODE_SWITCHED_TO_OBSERVER");
    };

    window.onload = () => { 
        initNet(); 
        setInterval(() => document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString(), 1000);
        log("SYSTEM_V8.2_WDE_READY", "sys-log"); 
    };
</script>
</body>
</html>
