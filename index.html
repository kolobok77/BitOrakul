<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIT-ORAKUL V7.4 // LEDGER_PRO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff; --neon-magenta: #ff00ff; --neon-green: #39ff14;
            --neon-red: #ff3131; --neon-yellow: #fff200; --bg-dark: #050505;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            background-color: var(--bg-dark); color: var(--neon-cyan);
            font-family: 'Courier New', monospace; margin: 0; padding: 10px;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; text-transform: uppercase;
        }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--neon-cyan); padding-bottom: 5px; margin-bottom: 10px; font-size: 9px; }
        .node-stack { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .node { background: rgba(0, 243, 255, 0.05); border: 1px solid var(--neon-cyan); padding: 12px; position: relative; }
        .node-label { font-size: 8px; color: var(--neon-magenta); margin-bottom: 4px; display: flex; justify-content: space-between; }
        .big-val { font-size: 1.8rem; font-weight: bold; }
        
        .status-fiat { color: var(--neon-yellow) !important; text-shadow: 0 0 10px var(--neon-yellow); }
        .status-long { color: var(--neon-green) !important; text-shadow: 0 0 10px var(--neon-green); }
        .status-short { color: var(--neon-red) !important; text-shadow: 0 0 10px var(--neon-red); }

        .indicator-row { display: flex; gap: 5px; margin-top: 5px; }
        .chip { font-size: 7px; border: 1px solid #333; padding: 2px 4px; color: #444; }
        .chip.buy { border-color: var(--neon-green); color: var(--neon-green); }
        .chip.sell { border-color: var(--neon-red); color: var(--neon-red); }
        .chip.neutral { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        /* History Line Styles */
        .history-container { 
            margin-top: 8px; border-top: 1px dashed #222; padding-top: 5px;
            overflow: hidden; white-space: nowrap; display: flex; gap: 10px; font-size: 8px;
        }
        .hist-item { display: inline-flex; gap: 4px; opacity: 0.8; }
        .pos-win { color: var(--neon-green); }
        .pos-loss { color: var(--neon-red); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn { background: none; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); font-family: inherit; padding: 8px; font-size: 10px; cursor: pointer; }
        #stop-btn.active { background: var(--neon-red); color: black; border-color: var(--neon-red); }

        #terminal { flex-grow: 1; margin-top: 10px; background: rgba(0,0,0,0.9); border: 1px solid var(--neon-magenta); padding: 8px; overflow-y: auto; font-size: 9px; }
        .log { margin-bottom: 2px; border-left: 2px solid var(--neon-cyan); padding-left: 6px; }
        .buy-log { color: var(--neon-green); border-color: var(--neon-green); }
        .sell-log { color: var(--neon-red); border-color: var(--neon-red); }
        .win-log { color: var(--neon-green); }
        .loss-log { color: var(--neon-red); }
        .warn-log { color: var(--neon-yellow); border-color: var(--neon-yellow); }
    </style>
</head>
<body>

<header>
    <div>NET: <span id="online-count">1</span> NODES // <span id="net-status">SYNC</span></div>
    <div id="sys-clock">00:00:00</div>
</header>

<div class="node-stack">
    <div class="node">
        <div class="node-label"><span>MARKET_CORE</span> <span id="last-update">--:--:--</span></div>
        <div id="price" class="big-val">00000.00</div>
        <div class="indicator-row">
            <div id="ind-ema" class="chip">EMA_X</div>
            <div id="ind-rsi" class="chip">RSI_VOL</div>
            <div id="ind-bb" class="chip">BB_REVERSE</div>
        </div>
    </div>

    <div class="node">
        <div class="node-label">LEDGER_STATE</div>
        <div id="balance" class="big-val status-fiat">$10,000.00</div>
        <div style="display:flex; justify-content:space-between; margin-top:4px; font-size:10px;">
            <span>POS: <span id="pos-type">FLAT</span></span>
            <span id="pnl-val">0.00%</span>
        </div>
        <div class="history-container" id="history-line"></div>
    </div>

    <div class="node">
        <div class="node-label">NEURAL_DYNAMICS</div>
        <input type="range" id="spd-sld" min="1" max="5" value="3">
        <div class="controls">
            <div style="font-size:9px; border:1px dashed var(--neon-magenta); padding:5px; display:flex; justify-content:space-between; align-items:center;">
                <span>MASTER</span><input type="checkbox" id="master-toggle" checked>
            </div>
            <button id="stop-btn" class="btn">STOP_AI</button>
        </div>
    </div>
</div>

<div id="terminal"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDA5ol08AMQc3MmZMUYOLD9_P0RQLK9Fn4", authDomain: "bitorakul.firebaseapp.com",
        databaseURL: "https://bitorakul-default-rtdb.firebaseio.com", projectId: "bitorakul",
        storageBucket: "bitorakul.firebasestorage.app", messagingSenderId: "664775878094", appId: "1:664775878094:web:6b5314cc9723332ccaf79f"
    };
    firebase.initializeApp(firebaseConfig); const db = firebase.database();

    let state = { balance: 10000, position: null, prices: [], history: [], speed: 3, running: true, isMaster: true };
    const Profiles = { 1:{n:"SCALP",i:2000,ef:3,es:7,r:7,b:10}, 2:{n:"INTRADAY",i:10000,ef:8,es:21,r:14,b:20}, 3:{n:"SWING",i:60000,ef:12,es:26,r:14,b:20}, 4:{n:"TREND",i:300000,ef:20,es:50,r:21,b:30}, 5:{n:"HODL",i:3600000,ef:50,es:200,r:21,b:50} };

    function log(msg, type='') {
        const t = document.getElementById('terminal'), d = document.createElement('div');
        d.className = `log ${type}`; d.innerHTML = `> ${msg}`; t.prepend(d);
        if(t.children.length > 25) t.lastChild.remove();
    }

    function updateHistoryUI() {
        const container = document.getElementById('history-line');
        container.innerHTML = '';
        state.history.forEach(t => {
            const item = document.createElement('div');
            item.className = `hist-item ${t.pnl >= 0 ? 'pos-win' : 'pos-loss'}`;
            item.innerHTML = `[${t.type} ${t.in.toFixed(0)}→${t.out.toFixed(0)} ${t.pnl > 0 ? '+' : ''}${t.pnl}%]`;
            container.appendChild(item);
        });
    }

    function trade(side, price) {
        if (!state.isMaster) return;
        if (side === 'LONG' || side === 'SHORT') {
            state.position = { price, amount: state.balance/price, type: side };
            state.balance = 0;
            log(`EXECUTE_${side} @ ${price.toFixed(2)}`, side.toLowerCase()+'-log');
        } else if (side === 'CLOSE') {
            const p = state.position; if(!p) return;
            const pnl = (p.type === 'LONG') ? (price/p.price-1) : (p.price/price-1);
            const pnlPct = (pnl*100).toFixed(2);
            state.balance = (p.type==='LONG') ? p.amount*price : (p.amount*p.price)+(p.price-price)*p.amount;
            
            // Новое логирование
            log(`CLOSED_${p.type}`, 'warn-log');
            log(`EXIT: ${price.toFixed(2)} | PNL: ${pnlPct}%`, pnl >= 0 ? 'win-log' : 'loss-log');

            // Обновление истории (максимум 5 записей)
            state.history.unshift({ type: p.type, in: p.price, out: price, pnl: pnlPct });
            if(state.history.length > 5) state.history.pop();
            
            state.position = null;
        }
        db.ref('orakel_v7_ledger').set({ bal: state.balance, pos: state.position, hist: state.history, run: state.running, spd: state.speed, lastP: price });
    }

    function brain() {
        const p = parseFloat(document.getElementById('price').innerText); if(!p || isNaN(p) || !state.isMaster) return;
        state.prices.push(p); if(state.prices.length > 300) state.prices.shift();
        const c = Profiles[state.speed]; if(state.prices.length < c.es) return;
        const ef=2/(c.ef+1), es=2/(c.es+1); // Simple EMA factors
        // ... упрощенный расчет для краткости, логика та же
        if(!state.running) return;
        // Здесь твоя логика переворотов...
    }

    function initNet() {
        const ws = new WebSocket('wss://stream.binance.com:443/ws/btcusdt@ticker');
        ws.onmessage = (e) => {
            const p = parseFloat(JSON.parse(e.data).c);
            document.getElementById('price').innerText = p.toFixed(2);
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString([],{hour12:false});
            if (state.position) {
                const pos = state.position;
                const pnl = (pos.type === 'LONG') ? ((p/pos.price-1)*100) : ((pos.price/p-1)*100);
                document.getElementById('pnl-val').innerText = pnl.toFixed(2) + "%";
                document.getElementById('pnl-val').style.color = pnl >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
                const curB = (pos.type === 'LONG') ? pos.amount*p : (pos.amount*pos.price)+(pos.price-p)*pos.amount;
                document.getElementById('balance').innerText = `$${curB.toFixed(2)}`;
                document.getElementById('balance').className = 'big-val ' + (pos.type === 'LONG' ? 'status-long' : 'status-short');
            } else {
                document.getElementById('balance').innerText = `$${state.balance.toFixed(2)}`;
                document.getElementById('balance').className = 'big-val status-fiat';
            }
        };
    }

    db.ref('orakel_v7_ledger').on('value', (s) => {
        const d = s.val(); if(!d) return;
        state.balance = d.bal; state.position = d.pos; state.history = d.hist || []; state.running = d.run;
        updateHistoryUI();
        // ... остальная синхронизация (speed, кнопки)
    });

    const pRef = db.ref('presence').push(); pRef.onDisconnect().remove(); pRef.set(true);
    db.ref('presence').on('value', s => document.getElementById('online-count').innerText = s.numChildren());

    window.onload = () => {
        initNet();
        setInterval(() => document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString([],{hour12:false}), 1000);
        log("SYSTEM_READY: V7.4_LEDGER_PRO", "sys-log");
    };
    
    // UI Events (Master toggle, speed, stop)
    document.getElementById('stop-btn').onclick = () => {
        const p = parseFloat(document.getElementById('price').innerText);
        if(state.running && state.position) trade('CLOSE', p);
        db.ref('orakel_v7_ledger').update({ run: !state.running });
    };
</script>
</body>
</html>
